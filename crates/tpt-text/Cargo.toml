[package]
name = "tpt-text"
description = "Pure-Rust, deterministic text shaping and layout substrate for the TPT ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []
fontdb = ["std", "dep:fontdb"]
serde = ["dep:serde"]

[dependencies]
rustybuzz = { version = "0.20.1", default-features = false }
unicode-linebreak = { version = "0.1.5", default-features = false }
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-script = { version = "0.5.8", default-features = false }
spin = { version = "0.12.3", default-features = false, features = ["rwlock"] }
fontdb = { version = "0.24.0", optional = true, default-features = false, features = ["std", "fs"] }
serde = { version = "1.0.229", optional = true, default-features = false, features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
tpt-golden = { path = "../tpt-golden" }
serde = { version = "1.0.229", features = ["derive"] }

[[bench]]
name = "layout"
harness = false
