name: Unicode data update

# Runs twice a year. Unicode releases each autumn, so the March run catches
# corrections and the October run picks up the new release.
on:
  schedule:
    - cron: "0 6 15 3,10 *"
  workflow_dispatch:
    inputs:
      version:
        description: "Unicode version to fetch (blank for the latest published)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Unicode data and regenerate tables
        env:
          UNICODE_VERSION: ${{ inputs.version }}
        run: scripts/update-unicode.sh "$UNICODE_VERSION"

      # A new Unicode version can change rules, not only data. If these fail,
      # the job stops before opening a pull request and someone must update
      # crates/tpt-text-linebreak/src/rules.rs.
      - name: Test
        run: cargo test --workspace

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: unicode-update
          commit-message: "Update Unicode line break data"
          title: "Update Unicode line break data"
          body: |
            Regenerated `tpt-text-linebreak` tables and conformance data from the
            latest Unicode release. Workspace tests pass.

            Generated by the scheduled Unicode data update workflow.
