[workspace]
resolver = "2"
members = ["crates/tpt-text", "crates/tpt-golden", "crates/tpt-text-fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "UNLICENSED"
repository = "https://github.com/tpt-solutions/tpt-text"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "warn"
