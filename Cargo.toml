[workspace]
resolver = "2"
members = ["xtask", "crates/tpt-text-wasm", "crates/tpt-text-cli", "crates/tpt-text", "crates/tpt-text-golden", "crates/tpt-text-snapshot", "crates/tpt-text-fuzz", "crates/tpt-text-wasm-check", "crates/tpt-text-linebreak", "crates/tpt-text-linebreak-gen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-text"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "warn"
